# Builds wheels for xpd on native runners. A pushed v* tag also publishes them to PyPI with
# trusted publishing and attaches them to a GitHub Release. Pushes to main build the same wheels
# without publishing, which fills the sccache cache that a tag restores, since a tag can only
# restore caches from the default branch. Started from `maturin generate-ci github` (maturin 1.16).
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: [docs/**, zensical.toml, "**.md"]
  workflow_dispatch:

permissions:
  contents: read

# Each branch or tag gets its own queue, and a new run waits for the running one to finish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # mise.toml pins Rust. Runners ship older toolchains, so every build installs this one.
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.read.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: read
        run: python3 -c 'import tomllib; print("rust=" + tomllib.load(open("mise.toml", "rb"))["tools"]["rust"]["version"])' >> "$GITHUB_OUTPUT"

  linux:
    needs: [toolchain]
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build wheels
        # The cache comes only from runs on main, which run reviewed code, as bas also accepts.
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0 # jactionlint ignore=cache-poisoning
        with:
          target: ${{ matrix.platform.target }}
          rust-toolchain: ${{ needs.toolchain.outputs.rust }}
          args: --release --out dist
          sccache: 'true'
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  musllinux:
    needs: [toolchain]
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build wheels
        # The cache comes only from runs on main, which run reviewed code, as bas also accepts.
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0 # jactionlint ignore=cache-poisoning
        with:
          target: ${{ matrix.platform.target }}
          rust-toolchain: ${{ needs.toolchain.outputs.rust }}
          args: --release --out dist
          sccache: 'true'
          manylinux: musllinux_1_2
      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist

  windows:
    needs: [toolchain]
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
          - runner: windows-11-arm
            target: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build wheels
        # The cache comes only from runs on main, which run reviewed code, as bas also accepts.
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0 # jactionlint ignore=cache-poisoning
        with:
          target: ${{ matrix.platform.target }}
          rust-toolchain: ${{ needs.toolchain.outputs.rust }}
          args: --release --out dist
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    needs: [toolchain]
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build wheels
        # The cache comes only from runs on main, which run reviewed code, as bas also accepts.
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0 # jactionlint ignore=cache-poisoning
        with:
          target: ${{ matrix.platform.target }}
          rust-toolchain: ${{ needs.toolchain.outputs.rust }}
          args: --release --out dist
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-sdist
          path: dist

  # Only this job may mint a PyPI token, as the uv publishing guide recommends.
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [linux, musllinux, windows, macos, sdist]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      - name: Check the tag matches the package version
        run: |
          expected="wheels-sdist/xpd-${GITHUB_REF_NAME#v}.tar.gz"
          test -f "$expected" || { echo "tag $GITHUB_REF_NAME does not match $(ls wheels-sdist)"; exit 1; }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # A cache restored here could slip into what gets published.
          enable-cache: false
      # A failure is repeated as an annotation, which shows on the run page without opening the log.
      - name: Publish
        run: |
          set -o pipefail
          uv publish --trusted-publishing always 'wheels-*/*' 2>&1 | tee publish.log || {
            echo "::error title=uv publish failed::$(grep -v '^Uploading\|^Publishing' publish.log | tail -n 6 | tr '\n' ' ')"
            exit 1
          }

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [publish]
    permissions:
      # actions/attest signs with an OIDC token and stores the attestation.
      id-token: write
      attestations: write
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'wheels-*/*'
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes wheels-*/*
        env:
          GH_TOKEN: ${{ github.token }}
